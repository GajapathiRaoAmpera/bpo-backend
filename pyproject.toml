[tool.poetry]
name = "assurevoice-backend"
version = "1.0.0"
description = "AssureVoice AI sandbox: FastAPI backend and voice agent"
authors = ["AssureVoice Engineering"]
readme = "README.md"
package-mode = false

# Phase 1 (core). Voice/Gemini/scheduler deps are added in their phases.
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.162.0"
uvicorn = { version = "0.54.0", extras = ["standard"] }
pydantic = "2.14.1"
pydantic-settings = "2.16.2"
email-validator = "2.3.0"
sqlalchemy = "2.1.6"
pyjwt = "2.15.1"
passlib = { version = "1.7.4", extras = ["bcrypt"] }
# passlib 1.7.4 breaks on bcrypt>=4.1
bcrypt = "4.0.1"
faker = "40.44.0"
pipecat-ai = {version = "1.15.0", extras = ["google", "silero", "webrtc"]}
google-genai = "2.34.0"
apscheduler = "3.11.3"
psycopg = { version = "3.3.6", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
httpx = "0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
